<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Sign Up | IELTS Score Accelerator</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .auth-container { max-width: 450px; margin: 3rem auto; padding: 0 1rem; }
    .auth-box { background: var(--card); border-radius: var(--radius); padding: 2.5rem; border: 1px solid var(--border); box-shadow: 0 4px 20px rgba(0,0,0,0.06); }
    .auth-tabs { display: flex; margin-bottom: 2rem; border-bottom: 2px solid var(--border); }
    .auth-tab { flex: 1; padding: 0.8rem; text-align: center; cursor: pointer; font-weight: 600; color: var(--text-light); transition: color 160ms var(--ease-out), border-color 160ms var(--ease-out); border-bottom: 2px solid transparent; margin-bottom: -2px; }
    .auth-tab.active { color: var(--primary); border-bottom-color: var(--primary); }
    .form-group { margin-bottom: 1.2rem; }
    .form-group label { display: block; font-size: 0.9rem; font-weight: 500; margin-bottom: 0.4rem; color: var(--text-light); }
    .form-group input, .form-group select { width: 100%; padding: 0.7rem 1rem; border: 2px solid var(--border); border-radius: 8px; font-size: 1rem; transition: border-color 160ms var(--ease-out); }
    .form-group input:focus { outline: none; border-color: var(--primary); }
    .form-group .error { color: #ef4444; font-size: 0.8rem; margin-top: 0.3rem; display: none; }
    .google-btn {
      width: 100%; padding: 0.9rem; font-size: 1rem; margin-top: 0.5rem;
      display: flex; align-items: center; justify-content: center; gap: 0.5rem;
      background: #fff; color: #1a1a1a; border: 2px solid var(--border); border-radius: 8px;
      font-weight: 600; cursor: pointer;
      transition: transform 160ms var(--ease-out), border-color 160ms var(--ease-out);
    }
    .google-btn:active { transform: scale(0.97); }
    .google-btn:hover { border-color: var(--primary); }
    .google-btn svg { width: 20px; height: 20px; }
    .auth-box .btn { width: 100%; padding: 0.9rem; font-size: 1.1rem; margin-top: 0.5rem; }
    .divider { text-align: center; margin: 1.5rem 0; color: var(--text-light); font-size: 0.85rem; position: relative; }
    .divider::before, .divider::after { content: ''; position: absolute; top: 50%; width: 40%; height: 1px; background: var(--border); }
    .divider::before { right: 0; }
    .divider::after { left: 0; }
    .success-msg { display: none; text-align: center; padding: 3rem 1rem; }
    .success-msg .icon { font-size: 3rem; margin-bottom: 1rem; }
    .success-msg h3 { margin-bottom: 0.5rem; }
    .success-msg p { color: var(--text-light); }
    .password-toggle { position: relative; }
    .password-toggle button { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem; }
    .msg-box { padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; display: none; }
    .msg-box.error { background: #fee2e2; color: #dc2626; border: 1px solid #fecaca; }
    .msg-box.success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
    /* ===== Responsive ===== */
    @media (max-width: 768px) {
      .auth-container { margin: 2rem auto; padding: 0 1rem; }
      .auth-box { padding: 1.5rem 1.2rem; }
      .auth-tab { padding: 0.7rem; font-size: 0.9rem; }
      .form-group input, .form-group select { padding: 0.65rem 0.8rem; font-size: 0.95rem; }
      .google-btn { padding: 0.8rem; font-size: 0.95rem; }
      .auth-box .btn { font-size: 1rem; padding: 0.8rem; }
    }
  </style>
</head>
<body>

<nav class="navbar">
  <a href="../index.html" class="logo"><img src="../images/logo-color.png" alt="IELTS Score Accelerator" style="height:48px"></a>
  <div class="nav-links">
    <a href="reading.html">Reading</a>
    <a href="listening.html">Listening</a>
    <a href="writing.html">Writing</a>
    <a href="speaking.html">Speaking</a>
    <a href="test.html" class="btn btn-outline">Placement Test</a>
    <a href="register.html" class="btn btn-primary">Sign Up</a>
  </div>
</nav>

<div class="section">
  <div class="auth-container">
    <div class="auth-box">
      <div class="auth-tabs">
        <div class="auth-tab active" onclick="switchTab('login')">Login</div>
        <div class="auth-tab" onclick="switchTab('register')">Sign Up</div>
      </div>

      <div id="globalMsg" class="msg-box"></div>

      <!-- Login Form -->
      <form id="loginForm" onsubmit="handleLogin(event)">
        <button type="button" class="google-btn" onclick="handleGoogle()">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Continue with Google
        </button>

        <div class="divider">or</div>

        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-toggle">
            <input type="password" id="loginPass" placeholder="Enter your password" required>
            <button type="button" onclick="togglePass('loginPass')">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Login</button>
      </form>

      <!-- Register Form -->
      <form id="registerForm" style="display:none" onsubmit="handleRegister(event)">
        <button type="button" class="google-btn" onclick="handleGoogle()">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
          Sign up with Google
        </button>

        <div class="divider">or</div>

        <div class="form-group">
          <label>Full Name</label>
          <input type="text" id="regName" placeholder="John Doe" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="regEmail" placeholder="you@example.com" required>
        </div>
        <div class="form-group">
          <label>Current IELTS Level</label>
          <select id="regLevel">
            <option value="">Select your level...</option>
            <option value="beginner">Beginner (Band 1-3)</option>
            <option value="intermediate">Intermediate (Band 4-5)</option>
            <option value="upper">Upper-Intermediate (Band 5.5-6)</option>
            <option value="advanced">Advanced (Band 6.5+)</option>
            <option value="unknown">Not sure</option>
          </select>
        </div>
        <div class="form-group">
          <label>Password</label>
          <div class="password-toggle">
            <input type="password" id="regPass" placeholder="At least 8 characters" required minlength="8">
            <button type="button" onclick="togglePass('regPass')">👁</button>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <div class="password-toggle">
            <input type="password" id="regPassConfirm" placeholder="Re-enter password" required>
            <button type="button" onclick="togglePass('regPassConfirm')">👁</button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary">Create Account</button>
      </form>

      <!-- Success -->
      <div class="success-msg" id="successMsg">
        <div class="icon">🎉</div>
        <h3 id="successTitle"></h3>
        <p id="successText"></p>
        <br>
        <a href="dashboard.html" class="btn btn-primary">Go to Dashboard</a>
      </div>
    </div>
  </div>
</div>

<!-- Supabase JS via CDN (non-module) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- Auth helper (non-module, exposes signInWithGoogle, signUp, signIn, etc. globally) -->
<script src="../js/auth.js"></script>

<script>
  function showMsg(text, type) {
    const el = document.getElementById('globalMsg');
    el.textContent = text;
    el.className = 'msg-box ' + type;
    el.style.display = 'block';
    // Keep visible longer for errors
    const duration = type === 'error' ? 8000 : 5000;
    setTimeout(() => el.style.display = 'none', duration);
  }

  // Google
  window.handleGoogle = async function() {
    try {
      showMsg('Redirecting to Google...', 'success');
      await signInWithGoogle();
    } catch (err) {
      console.error('Google sign-in failed:', err);
      showMsg(err.message || 'Google sign-in failed. Please try again.', 'error');
    }
  };

  // Login
  window.handleLogin = async function(e) {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const pass = document.getElementById('loginPass').value;
    try {
      showMsg('Logging in...', 'success');
      await signIn(email, pass);
      window.location.href = 'dashboard.html';
    } catch (err) {
      console.error('Login failed:', err);
      showMsg(err.message || 'Login failed. Please try again.', 'error');
    }
  };

  // Register
  window.handleRegister = async function(e) {
    e.preventDefault();
    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const pass = document.getElementById('regPass').value;
    const confirm = document.getElementById('regPassConfirm').value;

    if (pass !== confirm) {
      showMsg('Passwords do not match.', 'error');
      return;
    }

    try {
      showMsg('Creating account...', 'success');
      await signUp(email, pass, name);
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'none';
      document.getElementById('successMsg').style.display = 'block';
      document.getElementById('successTitle').textContent = 'Account Created!';
      document.getElementById('successText').textContent = 'Check your email to verify, then login.';
    } catch (err) {
      console.error('Registration failed:', err);
      showMsg(err.message || 'Registration failed. Please try again.', 'error');
    }
  };
</script>

<script>
  function switchTab(tab) {
    document.querySelectorAll('.auth-tab').forEach(t => t.classList.remove('active'));
    document.getElementById('globalMsg').style.display = 'none';
    if (tab === 'login') {
      document.querySelectorAll('.auth-tab')[0].classList.add('active');
      document.getElementById('loginForm').style.display = 'block';
      document.getElementById('registerForm').style.display = 'none';
    } else {
      document.querySelectorAll('.auth-tab')[1].classList.add('active');
      document.getElementById('loginForm').style.display = 'none';
      document.getElementById('registerForm').style.display = 'block';
    }
    document.getElementById('successMsg').style.display = 'none';
  }
  function togglePass(id) {
    const input = document.getElementById(id);
    input.type = input.type === 'password' ? 'text' : 'password';
  }
</script>

<footer class="footer">
  <div class="footer-links">
    <a href="reading.html">Reading</a>
    <a href="listening.html">Listening</a>
    <a href="writing.html">Writing</a>
    <a href="speaking.html">Speaking</a>
    <a href="https://youtube.com/@ieltsscoreaccelerator" target="_blank">YouTube</a>
  </div>

</footer>

<!-- Mobile Nav Toggle -->
<script>
(function() {
  var nav = document.querySelector('.navbar');
  if (!nav) return;
  if (!nav.querySelector('.nav-toggle')) {
    var toggle = document.createElement('button');
    toggle.className = 'nav-toggle';
    toggle.setAttribute('aria-label', 'Toggle navigation');
    toggle.innerHTML = '<span class="hamburger"></span>';
    var navLinks = nav.querySelector('.nav-links');
    if (navLinks) nav.insertBefore(toggle, navLinks);
    else nav.appendChild(toggle);
  }
  var backdrop = document.createElement('div');
  backdrop.className = 'nav-backdrop';
  document.body.appendChild(backdrop);
  var toggleBtn = nav.querySelector('.nav-toggle');
  var links = nav.querySelector('.nav-links');
  function closeMenu() { toggleBtn.classList.remove('active'); links.classList.remove('open'); backdrop.classList.remove('open'); document.body.style.overflow = ''; }
  function openMenu() { toggleBtn.classList.add('active'); links.classList.add('open'); backdrop.classList.add('open'); document.body.style.overflow = 'hidden'; }
  toggleBtn.addEventListener('click', function() { links.classList.contains('open') ? closeMenu() : openMenu(); });
  backdrop.addEventListener('click', closeMenu);
  links.querySelectorAll('a').forEach(function(a) { a.addEventListener('click', closeMenu); });
})();
</script>
</body>
</html>
